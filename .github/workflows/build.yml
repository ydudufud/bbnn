name: Build Flutter Apps
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0', channel: 'stable' }
      - uses: actions/cache@v4
        with: { path: '~/.pub-cache', key: '${{ runner.os }}-flutter-target-${{ hashFiles(''target_final/pubspec.lock'') }}' }
      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_TARGET }}' > target_final/android/app/google-services.json
      - run: cd target_final && flutter pub get
      - run: cd target_final && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: Target_App_Firestore, path: target_final/build/app/outputs/flutter-apk/app-release.apk }
  build-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0', channel: 'stable' }
      - uses: actions/cache@v4
        with: { path: '~/.pub-cache', key: '${{ runner.os }}-flutter-controller-${{ hashFiles(''controller_final/pubspec.lock'') }}' }
      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_CONTROLLER }}' > controller_final/android/app/google-services.json
      - run: cd controller_final && flutter pub get
      - run: cd controller_final && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: Controller_App_Firestore, path: controller_final/build/app/outputs/flutter-apk/app-release.apk }
